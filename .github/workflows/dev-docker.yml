name: Dev Docker Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name or PR number (e.g. my-feature or 42)'
        required: true
        type: string
      tag:
        description: 'Override the image tag (optional, default: pr-<N> or <branch-name>)'
        required: false
        type: string

jobs:
  setup:
    name: Resolve ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      registry: ${{ steps.resolve.outputs.registry }}
      transcoder: ${{ steps.transcoder.outputs.present }}
    steps:
      - name: Resolve ref and tag
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_REF" =~ ^[0-9]+$ ]]; then
            RESOLVED_REF="refs/pull/${INPUT_REF}/merge"
            DEFAULT_TAG="pr-${INPUT_REF}"
          else
            RESOLVED_REF="$INPUT_REF"
            STRIPPED=$(echo "$INPUT_REF" | sed -E 's|^[a-z]+/||')
            # Docker tags: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}
            DEFAULT_TAG=$(echo "$STRIPPED" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-' | sed -E 's/^[.-]+//' | cut -c1-128)
          fi
          if [[ -n "$INPUT_TAG" ]]; then
            FINAL_TAG="$INPUT_TAG"
            [[ "$FINAL_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || {
              echo "::error::Tag override '$FINAL_TAG' is not a valid Docker tag (letters, digits, _ . -; must not start with . or -; at most 128 characters)"
              exit 1
            }
          else
            FINAL_TAG="$DEFAULT_TAG"
            [[ -n "$FINAL_TAG" ]] || {
              echo "::error::Could not derive an image tag from ref '$INPUT_REF'; pass the tag input"
              exit 1
            }
          fi
          echo "ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          sparse-checkout: services/transcoder
      - name: Check for the transcoder
        id: transcoder
        run: |
          if [[ -f services/transcoder/Dockerfile ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/transcoder/Dockerfile is not on this ref; skipping the transcoder image"
          fi

  aiostreams:
    name: aiostreams
    needs: setup
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      image: aiostreams
      registry: ${{ needs.setup.outputs.registry }}
      tags: ${{ needs.setup.outputs.tag }}
      metadata-channel: dev
      metadata-ref: ${{ needs.setup.outputs.tag }}

  transcoder:
    name: aiostreams-transcoder
    needs: setup
    if: needs.setup.outputs.transcoder == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      image: aiostreams-transcoder
      registry: ${{ needs.setup.outputs.registry }}
      tags: ${{ needs.setup.outputs.tag }}
      context: services/transcoder
      dockerfile: services/transcoder/Dockerfile
      cache-scope: aiostreams-transcoder-
