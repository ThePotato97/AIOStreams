name: Dev Docker Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name or PR number (e.g. my-feature or 42)'
        required: true
        type: string
      tag:
        description: 'Override the image tag (optional, default: pr-<N> or <branch-name>)'
        required: false
        type: string

jobs:
  setup:
    name: Resolve ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      registry: ${{ steps.resolve.outputs.registry }}
    steps:
      - name: Resolve ref and tag
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_REF" =~ ^[0-9]+$ ]]; then
            RESOLVED_REF="refs/pull/${INPUT_REF}/merge"
            DEFAULT_TAG="pr-${INPUT_REF}"
          else
            RESOLVED_REF="$INPUT_REF"
            STRIPPED=$(echo "$INPUT_REF" | sed -E 's|^[a-z]+/||')
            DEFAULT_TAG=$(echo "$STRIPPED" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-' | sed 's/^-*//')
          fi
          FINAL_TAG="${INPUT_TAG:-$DEFAULT_TAG}"
          [[ "$FINAL_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo 'Invalid image tag'; exit 1; }
          echo "ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.suffix }})
    needs: setup
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aiostreams
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - image: aiostreams
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          - image: aiostreams-transcoder
            dockerfile: services/transcoder/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - image: aiostreams-transcoder
            dockerfile: services/transcoder/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.ref }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v7
        if: matrix.image == 'aiostreams'
        with:
          node-version: 24
      - name: Generate metadata
        if: matrix.image == 'aiostreams'
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.tag }}
        run: node scripts/generateMetadata.cjs --channel=dev --ref="$IMAGE_TAG" --commit="$(git rev-parse --short HEAD)"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ needs.setup.outputs.registry }}/${{ matrix.image }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.suffix }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p /tmp/digests
          printf '%s' "$DIGEST" > "/tmp/digests/$SUFFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-${{ matrix.suffix }}
          path: /tmp/digests/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }} manifest
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        image: [aiostreams, aiostreams-transcoder]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: ${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create and push manifest
        env:
          IMAGE: ${{ needs.setup.outputs.registry }}/${{ matrix.image }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE@$(cat /tmp/digests/amd64)" \
            "$IMAGE@$(cat /tmp/digests/arm64)"
