name: Build and Deploy Docker Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git Ref
        required: true
        type: string

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      channel: ${{ steps.tags.outputs.channel }}
      registry: ${{ steps.tags.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate tags
        id: tags
        env:
          INPUT_REF: ${{ inputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          declare TAGS=""
          case "${INPUT_REF}" in
          v[0-9]*.[0-9]*.[0-9]*)
            TAGS="${INPUT_REF}"
            if [[ "$(git rev-parse origin/main)" = "$(git rev-parse "${INPUT_REF}")" ]]; then
              MAJOR_MINOR=$(echo "${INPUT_REF}" | sed -E 's/v([0-9]+)\.([0-9]+)\.[0-9]+/\1.\2/')
              MAJOR=$(echo "${INPUT_REF}" | sed -E 's/v([0-9]+)\.[0-9]+\.[0-9]+/\1/')
              TAGS="${TAGS} latest v${MAJOR_MINOR} v${MAJOR}"
            fi
            CHANNEL="stable"
            ;;
          [0-9]*.[0-9]*.[0-9]*-nightly)
            TAGS="${INPUT_REF} nightly"
            CHANNEL="nightly"
            ;;
          *)
            echo "Invalid Input Ref: ${INPUT_REF}"
            exit 1
            ;;
          esac

          if [[ -z "${TAGS}" ]]; then
            echo "Empty Tags!"
            exit 1
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "registry=ghcr.io/${OWNER,,}" >> $GITHUB_OUTPUT

  image:
    name: aiostreams
    needs: setup
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-image.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      image: aiostreams
      registry: ${{ needs.setup.outputs.registry }}
      # Docker Hub publishing is only configured for the upstream repository.
      dockerhub-image: ${{ github.repository_owner == 'Viren070' && 'viren070/aiostreams' || '' }}
      tags: ${{ needs.setup.outputs.tags }}
      metadata-channel: ${{ needs.setup.outputs.channel }}

  notify:
    name: Notify
    needs: [setup, image]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Discord Notification
        env:
          CHANNEL: ${{ needs.setup.outputs.channel }}
          TAGS: ${{ needs.setup.outputs.tags }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping the notification."
            exit 0
          fi

          # Determine role based on channel
          if [ "$CHANNEL" = "stable" ]; then
            ROLE_ID="<@&1384627130272452638>"
            COLOR=5763719  # Green
            TITLE="🎉 Stable Release"
          else
            ROLE_ID="<@&1384627462155272242>"
            COLOR=15844367  # Orange
            TITLE="🌙 Nightly Build"
          fi

          # Format tags for display (each tag on a new line with bullet points)
          FORMATTED_TAGS=""
          for tag in $TAGS; do
            if [ -z "$FORMATTED_TAGS" ]; then
              FORMATTED_TAGS="• \`$tag\`"
            else
              FORMATTED_TAGS="$FORMATTED_TAGS\n• \`$tag\`"
            fi
          done

          # Get current timestamp in ISO 8601 format UTC
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create JSON payload file
          cat << EOF > discord_payload.json
          {
            "content": "$ROLE_ID",
            "embeds": [
              {
                "title": "$TITLE - Docker Images Published",
                "description": "New Docker images have been built and pushed to registries.",
                "color": $COLOR,
                "fields": [
                  {
                    "name": "📦 Channel",
                    "value": "• \`$CHANNEL\`",
                    "inline": true
                  },
                  {
                    "name": "🏷️ Tags Published",
                    "value": "$FORMATTED_TAGS",
                    "inline": false
                  },
                  {
                    "name": "📍 View Images",
                    "value": "[Docker Hub](https://hub.docker.com/r/viren070/aiostreams) · [GHCR](https://github.com/Viren070/AIOStreams/pkgs/container/aiostreams)",
                    "inline": false
                  },
                  {
                    "name": "📝 View Release Notes",
                    "value": "[GitHub](https://github.com/Viren070/AIOStreams/releases/tag/${{ inputs.ref }})",
                    "inline": false
                  },
                  {
                    "name": "🔗 View Build",
                    "value": "[GitHub Actions](https://github.com/Viren070/aiostreams/actions/runs/${{ github.run_id }})",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "AIOStreams CI",
                  "icon_url": "https://github.com/Viren070.png"
                },
                "timestamp": "$TIMESTAMP"
              }
            ]
          }
          EOF

          echo "Sending to Discord:"
          cat discord_payload.json

          # Send payload to Discord and capture response and status code
          http_response=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" \
            -X POST \
            -d @discord_payload.json \
            "$WEBHOOK_URL")

          http_body=$(echo "$http_response" | sed '$d')
          http_code=$(echo "$http_response" | tail -n1)

          echo "HTTP Status Code: $http_code"
          echo "Discord Response Body: $http_body"

          if [ "$http_code" != "204" ]; then
            echo "Error sending to Discord webhook."
            exit 1
          fi

          echo "Message sent successfully!"
